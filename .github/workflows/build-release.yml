# EcoEnchants fork —— 自动同步上游 + 自动构建 + 自动发 Release（v7）
# 位置：fork 根目录 .github/workflows/build-release.yml（整份替换原内容）
#
# 触发：schedule（每天 UTC 18:00 = 北京 02:00）/ push master / push v* / 手动 Run workflow
#
# ⚠️ 一次性前置检查：Settings -> Actions -> General -> Workflow permissions
#    必须选 "Read and write permissions"，否则 GITHUB_TOKEN 只读，push 与发 Release 都会被拒
#    （push 被拒 exit code 128；Release 被拒 gh 会报 Resource not accessible / HTTP 403）
#
# v5 -> v6 改动（因为「构建成功但没发 Release」）
#   1. 根因：v5 的发布步骤写的是 if: startsWith(github.ref, 'refs/tags/')，
#      而 push master / 手动触发的 ref 是 refs/heads/master → 永远 skipped。
#   2. 换成 gh CLI 显式判断，三条路径都能发：
#        push tag   -> 用该 tag 发（已存在则覆盖附件）
#        push master-> 用 v<gradle.properties 里的 version> 发；该 Release 已存在则跳过（避免每天刷）
#        Run workflow-> inputs.release = auto / always / never，默认 auto
#   3. 版本号从 gradle.properties 的 version= 读，不再手填。
#   4. sync/build 两个 job 加 github.actor != 'github-actions[bot]' 守卫：
#      万一以后换成 PAT（SYNC_TOKEN），PAT 建的 tag 会再次触发 workflow，这个守卫直接掐断自激循环。
#      （用 GITHUB_TOKEN 建 tag 本身不会触发新 run，守卫只是保险。）
#
# v6 -> v7 改动（为了保住 README 顶部的免责声明）
#   1. merge 加 -X ours：上游若也改了 README，冲突默认保留 fork 这侧，不会因冲突让同步失败，
#      也不会把免责声明冲掉；上游对 README 其它段落的改动照常合并。
#   2. 「剥离 .github/workflows」逻辑改成无条件执行：以前用 git cat-file 做门控，
#      如果 fork 里整个目录都被删了就会跳过还原，导致上游的 workflow 改动进入待推列表 → push 被拒。
#      现在无论 before 有没有该目录，都把工作区还原成合并前的样子。
#   3. 补 modify/delete 冲突兜底：你在 fork 里删了 workflow 文件、上游又改了同一个文件时，
#      -X ours 不生效（git 报 CONFLICT (modify/delete)）。现在检测到 .github/workflows 内的
#      未合并路径就按「合并前状态」解决并完成合并；其它文件的冲突照旧报错退出，不静默吞掉。
#   4. 合并后自检 README 里的免责声明是否还在，日志里直接给结论。

name: Sync & Build

on:
  schedule:
    - cron: '0 18 * * *'
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release:
        description: '是否发布 Release（auto=该版本没有才发，always=强制覆盖，never=只出构件）'
        type: choice
        options: [ auto, always, never ]
        default: auto

permissions:
  contents: write

env:
  UPSTREAM_REPO: Auxilor/EcoEnchants
  UPSTREAM_BRANCH: master
  TAG_PREFIX: 'v'

jobs:
  # ---------- 1. 同步上游 ----------
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream into fork
        id: sync
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          UPSTREAM_URL: https://github.com/Auxilor/EcoEnchants.git
          BRANCH: master
        run: |
          set -euo pipefail

          echo "::group::环境"
          git --version
          git remote -v
          git log --oneline -3
          echo "::endgroup::"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          before=$(git rev-parse HEAD)

          echo "::group::fetch upstream"
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || true
          git fetch --no-tags "$UPSTREAM_URL" "refs/heads/${BRANCH}" \
            || { echo "::error::拉取上游失败（网络或仓库不可访问）"; exit 1; }
          upstream_sha=$(git rev-parse FETCH_HEAD)
          echo "fork     tip = $before"
          echo "upstream tip = $upstream_sha"
          echo "::endgroup::"

          # 上游没有新提交（或已是祖先）-> 什么都不做
          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "ℹ️ 上游无新提交，跳过"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::group::merge upstream"
          # -X ours：内容冲突时保留 fork 这侧 —— 用来保住 README 顶部的免责声明。
          # 这是全局策略，但只在「两边同时改了同一处」时才生效；本地改动只有 README.md
          # （.github/workflows 会在下一步被还原），所以影响范围可控。
          if ! git merge --no-ff --no-edit -X ours "$upstream_sha"; then
            # 唯一预期内的冲突来源是 .github/workflows：比如你在 fork 里删了上游又改过的文件
            # （modify/delete 冲突，-X ours 处理不了）。这部分无论如何都会被还原成「合并前状态」，
            # 所以直接按 ours 解决掉，把合并做完。
            if [ -n "$(git ls-files -u -- .github/workflows)" ]; then
              echo "ℹ️ .github/workflows 存在冲突 → 按合并前状态解决"
              git rm -r -f --ignore-unmatch .github/workflows >/dev/null 2>&1 || true
              if git cat-file -e "${before}:.github/workflows" 2>/dev/null; then
                git checkout "${before}" -- .github/workflows
              fi
              git add -A .github/workflows 2>/dev/null || true
            fi
            if [ -n "$(git ls-files -u)" ]; then
              echo "::error::与上游存在冲突，且不在 .github/workflows 内，请本地 git fetch upstream && git merge upstream/master 处理后再推上来："
              git ls-files -u | head -20
              git merge --abort || true
              exit 1
            fi
            if [ ! -f .git/MERGE_HEAD ]; then
              echo "::error::合并失败且没有进行中的合并，请看上面的 git 输出"
              exit 1
            fi
            git commit --no-edit >/dev/null
            echo "ℹ️ 已按 ours 策略解决 workflow 冲突并完成合并"
          fi
          echo "::endgroup::"

          echo "::group::strip workflows"
          # 默认 token 无权推送 .github/workflows 下的任何改动 → 一律把该目录还原成「合并前」的样子。
          # 合并前如果 fork 里就没这个目录（例如你把它们删了），就保持删除状态。
          git rm -r -f --ignore-unmatch .github/workflows >/dev/null 2>&1 || true
          if git cat-file -e "${before}:.github/workflows" 2>/dev/null; then
            git checkout "${before}" -- .github/workflows
          fi
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit >/dev/null
            echo "ℹ️ 已把 .github/workflows 还原为合并前状态"
          else
            echo "ℹ️ .github/workflows 无变化，无需还原"
          fi
          echo "::endgroup::"

          if grep -q "个人 fork" README.md 2>/dev/null; then
            echo "✅ README 免责声明在位"
          else
            echo "⚠️ README 里没找到免责声明，请确认 fork 的 README.md 顶部还在"
          fi

          after=$(git rev-parse HEAD)
          echo "merged tip = $after"
          echo "--- 本次要推上去的文件（不应出现 .github/workflows）---"
          git diff --name-only "origin/${BRANCH}" HEAD || true

          echo "::group::push"
          if ! git push origin "HEAD:${BRANCH}"; then
            echo "::error::push 被拒。最常见原因：仓库 Settings -> Actions -> General -> Workflow permissions 不是 'Read and write permissions'（默认是只读）。改完重跑即可。"
            exit 1
          fi
          echo "::endgroup::"

          echo "✅ 已同步上游：$before -> $after"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: decide
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"     # push / 手动触发：总是构建
          elif [ "${{ steps.sync.outputs.changed }}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"     # 定时且上游有更新：构建
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------- 2. 构建 + 发 Release ----------
  build:
    needs: sync
    if: needs.sync.outputs.build == 'true' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Runner diagnostics
        run: |
          echo "=== CPU ==="; nproc
          echo "=== MEM ==="; free -m
          echo "=== DISK ==="; df -h /

      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== MEM after swap ==="; free -m

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle version
        run: |
          chmod +x ./gradlew
          ./gradlew --version --console=plain

      - name: Build
        run: |
          ./gradlew build --stacktrace --console=plain \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC" \
            --max-workers=2

      - name: Collect jars
        if: always()
        run: |
          mkdir -p dist
          find . -path '*/build/libs/*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
            -exec cp -v {} dist/ \; || true
          ls -lh dist || true
          echo "=== MEM after build ==="; free -m

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EcoEnchants-${{ github.sha }}
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Read version
        id: ver
        if: success()
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^version[[:space:]]*=' gradle.properties | head -1 | cut -d= -f2- | tr -d ' \r')
          if [ -z "$VERSION" ]; then
            echo "::error::未能从 gradle.properties 读到 version="
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_PREFIX}${VERSION}" >> "$GITHUB_OUTPUT"
          echo "检测到版本：${TAG_PREFIX}${VERSION}"

      - name: Publish release
        id: release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ steps.ver.outputs.tag }}
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail

          # ---- 决定 tag 与模式 ----
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${VERSION_TAG}"
          fi

          MODE="${INPUT_RELEASE:-}"
          # auto / 未传值：按触发方式决定；tag 推送一律覆盖，其它情况该版本已发过就不重复发
          if [ -z "$MODE" ] || [ "$MODE" = "auto" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              MODE=always
            else
              MODE=if-missing
            fi
          fi

          echo "event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF} → tag=${TAG} mode=${MODE}"

          if [ "$MODE" = "never" ]; then
            echo "⏭ 输入指定 never，只出构件不发 Release"
            exit 0
          fi

          mapfile -t JARS < <(ls dist/*.jar 2>/dev/null || true)
          if [ "${#JARS[@]}" -eq 0 ]; then
            echo "::error::dist 目录里没有 jar，无法发布"
            exit 1
          fi
          printf '待发布文件：%s\n' "${JARS[@]}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$MODE" = "if-missing" ]; then
              echo "⏭ Release $TAG 已存在，跳过（避免每次同步都刷一条）"
              exit 0
            fi
            echo "♻️ Release $TAG 已存在，覆盖附件"
            gh release upload "$TAG" "${JARS[@]}" --clobber
          else
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "ℹ️ tag $TAG 已存在但还没 Release，直接建 Release"
              gh release create "$TAG" "${JARS[@]}" --title "$TAG" --generate-notes
            else
              echo "🆕 新建 tag $TAG 并发布 Release"
              gh release create "$TAG" "${JARS[@]}" --title "$TAG" --generate-notes --target "$GITHUB_SHA"
            fi
          fi

          echo "✅ Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"

# ─────────────────────────────────────────────────────────────
# 可选升级：连上游对 workflow 文件的改动一起同步
#   1. github.com/settings/personal-access-tokens/new
#      Repository access: Only select repositories -> leafpaper47/EcoEnchants
#      Permissions: Contents = Read and write，Workflows = Read and write
#   2. fork -> Settings -> Secrets and variables -> Actions -> New repository secret
#      名字 SYNC_TOKEN，值 github_pat_xxx
#   3. 删掉上面「剥离 .github/workflows」那段
#   token 必须传给 actions/checkout 的 token: 输入，传给 git push 步骤无效。
#
# ⚠️ 用了 SYNC_TOKEN（PAT）之后：PAT 建的 tag 会再次触发 workflow。
#    已有 github.actor != 'github-actions[bot]' 守卫兜底，正常不会自激。
# ─────────────────────────────────────────────────────────────
