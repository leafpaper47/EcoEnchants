# EcoEnchants fork —— 自动同步上游 + 自动构建（v4）
# 位置：fork 根目录 .github/workflows/build-release.yml（整份替换原内容）
#
# 工作方式
#   1. 每天 UTC 18:00（北京 02:00）把 Auxilor/EcoEnchants 的 master 合并进你的 fork
#   2. 上游有更新才构建；也可随时 Actions 页 Run workflow 强制构建
#   3. push v* 标签 → 自动发 Release 并附全部 jar
#
# ⚠️ 前置检查（一次性）：Settings -> Actions -> General -> Workflow permissions
#    必须选 "Read and write permissions"，否则 push 会被拒
#
# 关键设计：GITHUB_TOKEN 没有 workflows 权限，push 只要触碰 .github/workflows/**
#   就会被服务端拒绝（这是平台硬规则，permissions: 无法提权）。
#   所以合并后把 .github/workflows 还原成合并前的状态，让 diff 不包含 workflow 文件。
#   想连上游 workflow 改动一起同步？见文件底部注释（换 PAT）。

name: Sync & Build

on:
  schedule:
    # UTC 18:00 = 北京时间 02:00
    - cron: '0 18 * * *'
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: Auxilor/EcoEnchants
  UPSTREAM_BRANCH: master

jobs:
  # ---------- 1. 同步上游 ----------
  sync:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 有 SYNC_TOKEN 就用它（细粒度 PAT，Contents + Workflows 均为 Read and write）；
          # 没有就退回默认 token + 下面的 workflow 剥离逻辑
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream into fork
        id: sync
        # tag 触发时是 detached HEAD，不做合并
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          before=$(git rev-parse HEAD)

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}" \
            || { echo "::error::拉取上游失败"; exit 1; }

          if ! git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            echo "::error::上游合并冲突，请在本地 git fetch upstream && git merge upstream/master 处理后重跑"
            git merge --abort || true
            exit 1
          fi

          # 剥离 workflow 目录改动：默认 token 无权推送 workflow 文件
          if git cat-file -e "${before}:.github/workflows" 2>/dev/null; then
            git rm -r -f --ignore-unmatch .github/workflows
            git checkout "${before}" -- .github/workflows
            git commit --amend --no-edit
            echo "ℹ️ 已把 .github/workflows 还原为合并前状态"
          fi

          after=$(git rev-parse HEAD)

          if [ "$before" != "$after" ]; then
            git push origin "HEAD:${UPSTREAM_BRANCH}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ 已同步上游：$before -> $after"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ 上游无更新"
          fi

      - name: Decide whether to build
        id: decide
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"     # push / 手动触发：总是构建
          elif [ "${{ steps.sync.outputs.changed }}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"     # 定时且上游有更新：构建
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------- 2. 构建 ----------
  build:
    needs: sync
    if: needs.sync.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Runner diagnostics
        run: |
          echo "=== CPU ==="; nproc
          echo "=== MEM ==="; free -m
          echo "=== DISK ==="; df -h /

      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== MEM after swap ==="; free -m

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle version
        run: |
          chmod +x ./gradlew
          ./gradlew --version --console=plain

      - name: Build
        run: |
          ./gradlew build --stacktrace --console=plain \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC" \
            --max-workers=2

      - name: Collect jars
        if: always()
        run: |
          mkdir -p dist
          find . -path '*/build/libs/*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
            -exec cp -v {} dist/ \; || true
          ls -lh dist || true
          echo "=== MEM after build ==="; free -m

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EcoEnchants-${{ github.sha }}
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
          draft: false

# ─────────────────────────────────────────────────────────────
# 升级路径（可选）：连上游对 workflow 文件的改动一起同步
#   1. github.com/settings/personal-access-tokens/new
#      - Repository access: Only select repositories -> leafpaper47/EcoEnchants
#      - Permissions: Contents = Read and write，Workflows = Read and write
#   2. fork 仓库 -> Settings -> Secrets and variables -> Actions -> New repository secret
#      名字 SYNC_TOKEN，值填 github_pat_xxx
#   3. 把上面 "剥离 workflow 目录改动" 那段 if 块整段删掉
#   注意：token 必须传给 actions/checkout 的 token: 输入；
#         传给 git push 步骤是无效的（checkout 已经把凭据写进本地 git config）。
# ─────────────────────────────────────────────────────────────
