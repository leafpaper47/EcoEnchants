# EcoEnchants fork —— 自动同步上游 + 自动构建（v5）
# 位置：fork 根目录 .github/workflows/build-release.yml（整份替换原内容）
#
# 触发：schedule（每天 UTC 18:00 = 北京 02:00）/ push master / push v* / 手动 Run workflow
#
# ⚠️ 一次性前置检查：Settings -> Actions -> General -> Workflow permissions
#    必须选 "Read and write permissions"，否则 GITHUB_TOKEN 只读，git push 必被拒
#    （被拒时 exit code 是 128，日志里会有 "Permission to ... denied"）
#
# v4 -> v5 改动
#   1. 不再依赖 refs/remotes/upstream/master：改成 fetch 后取 FETCH_HEAD 的 SHA，直接 merge SHA
#      （v4 用的是 git merge upstream/master，若跟踪引用没落地就会 "not something we can merge" → exit 1）
#   2. 合并前先用 git merge-base --is-ancestor 判断上游是否真有新提交：
#      没有就直接 changed=false 退出，不再做 amend/push（v4 会在无更新时也 amend 出一个空提交）
#   3. 加 --no-ff，保证一定是真合并提交，剥离 workflow 的逻辑才成立
#   4. push 失败单独捕获，报出「可能是 Workflow permissions 只读」
#   5. 全程 ::group:: 分段，日志一眼能看出死在哪条命令

name: Sync & Build

on:
  schedule:
    - cron: '0 18 * * *'
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: Auxilor/EcoEnchants
  UPSTREAM_BRANCH: master

jobs:
  # ---------- 1. 同步上游 ----------
  sync:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream into fork
        id: sync
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          UPSTREAM_URL: https://github.com/Auxilor/EcoEnchants.git
          BRANCH: master
        run: |
          set -euo pipefail

          echo "::group::环境"
          git --version
          git remote -v
          git log --oneline -3
          echo "::endgroup::"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          before=$(git rev-parse HEAD)

          echo "::group::fetch upstream"
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || true
          git fetch --no-tags "$UPSTREAM_URL" "refs/heads/${BRANCH}" \
            || { echo "::error::拉取上游失败（网络或仓库不可访问）"; exit 1; }
          upstream_sha=$(git rev-parse FETCH_HEAD)
          echo "fork     tip = $before"
          echo "upstream tip = $upstream_sha"
          echo "::endgroup::"

          # 上游没有新提交（或已是祖先）-> 什么都不做
          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "ℹ️ 上游无新提交，跳过"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::group::merge upstream"
          if ! git merge --no-ff --no-edit "$upstream_sha"; then
            echo "::error::与上游合并冲突，请在本地 git fetch upstream && git merge upstream/master 处理后再推上来"
            git merge --abort || true
            exit 1
          fi
          echo "::endgroup::"

          # 剥离 .github/workflows：默认 token 无权推送 workflow 文件改动
          if git cat-file -e "${before}:.github/workflows" 2>/dev/null; then
            git rm -r -f --ignore-unmatch .github/workflows
            git checkout "${before}" -- .github/workflows
            git commit --amend --no-edit >/dev/null
            echo "ℹ️ 已把 .github/workflows 还原为合并前状态"
          fi

          after=$(git rev-parse HEAD)
          echo "merged tip = $after"
          echo "--- 本次要推上去的文件（不应出现 .github/workflows）---"
          git diff --name-only "origin/${BRANCH}" HEAD || true

          echo "::group::push"
          if ! git push origin "HEAD:${BRANCH}"; then
            echo "::error::push 被拒。最常见原因：仓库 Settings -> Actions -> General -> Workflow permissions 不是 'Read and write permissions'（默认是只读）。改完重跑即可。"
            exit 1
          fi
          echo "::endgroup::"

          echo "✅ 已同步上游：$before -> $after"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: decide
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"     # push / 手动触发：总是构建
          elif [ "${{ steps.sync.outputs.changed }}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"     # 定时且上游有更新：构建
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------- 2. 构建 ----------
  build:
    needs: sync
    if: needs.sync.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Runner diagnostics
        run: |
          echo "=== CPU ==="; nproc
          echo "=== MEM ==="; free -m
          echo "=== DISK ==="; df -h /

      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== MEM after swap ==="; free -m

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle version
        run: |
          chmod +x ./gradlew
          ./gradlew --version --console=plain

      - name: Build
        run: |
          ./gradlew build --stacktrace --console=plain \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC" \
            --max-workers=2

      - name: Collect jars
        if: always()
        run: |
          mkdir -p dist
          find . -path '*/build/libs/*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
            -exec cp -v {} dist/ \; || true
          ls -lh dist || true
          echo "=== MEM after build ==="; free -m

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EcoEnchants-${{ github.sha }}
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
          draft: false

# ─────────────────────────────────────────────────────────────
# 可选升级：连上游对 workflow 文件的改动一起同步
#   1. github.com/settings/personal-access-tokens/new
#      Repository access: Only select repositories -> leafpaper47/EcoEnchants
#      Permissions: Contents = Read and write，Workflows = Read and write
#   2. fork -> Settings -> Secrets and variables -> Actions -> New repository secret
#      名字 SYNC_TOKEN，值 github_pat_xxx
#   3. 删掉上面「剥离 .github/workflows」那段 if 块
#   token 必须传给 actions/checkout 的 token: 输入，传给 git push 步骤无效。
# ─────────────────────────────────────────────────────────────
