# EcoEnchants fork —— GitHub Actions 自动构建 v2（抗 OOM 加固版）
# 位置：fork 根目录 .github/workflows/build-release.yml
#
# v1 -> v2 改动（针对 "Error: The operation was canceled."）：
#   1. 去掉 --no-daemon：它强制 fork 单次 daemon，且堆设置不生效
#   2. 显式给 Gradle daemon 堆 -Xmx3g + Metaspace 1g（默认只有 512m）
#   3. --max-workers=2 限制并发 worker（org.gradle.parallel=true 时最吃内存）
#   4. 构建前加 4G swap，作为 OOM 保险丝
#   5. 去掉 concurrency.cancel-in-progress，排除被并发取消误杀
#   6. 加 Runner diagnostics / Gradle version 两步，便于下次失败时定位阶段

name: Build & Release

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Runner diagnostics
        run: |
          echo "=== CPU ==="; nproc
          echo "=== MEM ==="; free -m
          echo "=== DISK ==="; df -h /

      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== MEM after swap ==="; free -m

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle version
        run: |
          chmod +x ./gradlew
          ./gradlew --version --console=plain

      - name: Build
        run: |
          ./gradlew build --stacktrace --console=plain \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC" \
            --max-workers=2

      - name: Collect jars
        if: always()
        run: |
          mkdir -p dist
          find . -path '*/build/libs/*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
            -exec cp -v {} dist/ \; || true
          ls -lh dist || true
          echo "=== MEM after build ==="; free -m

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EcoEnchants-${{ github.sha }}
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
          draft: false
