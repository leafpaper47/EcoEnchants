# 适用于「已 Fork EcoEnchants 到自己账号」的仓库
# 放入 fork 根目录的 .github/workflows/build-release.yml
# 触发：push master / 手动 dispatch / 推 v* 标签（自动发 Release 并附 jar）
name: Build & Release

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --full-stacktrace --no-daemon

      - name: Collect jars
        run: |
          mkdir -p dist
          find . -path '*/build/libs/*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
            -exec cp -v {} dist/ \;
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcoEnchants-${{ github.sha }}
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
          draft: false
